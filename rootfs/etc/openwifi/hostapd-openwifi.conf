# hostapd configuration for OpenWiFi AP mode on Theshire
# 5 GHz channel 36, OFDM-only rates, open AP (WPA2-PSK commented out for bring-up)
#
# Known limitation: TX/data reliability is still degraded.
# Beacons are broadcast and association may complete, but DHCP/data traffic
# remains unreliable. See parent theshire docs:
# docs/guide_debug_openwifi.md and docs/guide_test_throughput.md.

interface=wlan0
driver=nl80211
country_code=CH
ssid=theshire
hw_mode=a
channel=36

# OFDM-only rates (no CCK/DSSS — OpenWiFi PHY is OFDM-only)
# Values are in units of 100 kbps
supported_rates=60 90 120 180 240 360 480 540
basic_rates=60 120 240

# 802.11n (HT) support
# Keep WMM explicit so HT/AMPDU/BlockAck behavior does not depend on hostapd
# defaults. AP mode here is still for controlled testing/bring-up, not a claim
# of broad production-grade AP interoperability.
wmm_enabled=1
ieee80211n=1
# require_ht=1 would block non-HT clients — omitted to reduce barriers

# Open AP (no encryption) — simplifies testing during bring-up
#wpa=2
#wpa_passphrase=theshire-test
#wpa_key_mgmt=WPA-PSK
#rsn_pairwise=CCMP
