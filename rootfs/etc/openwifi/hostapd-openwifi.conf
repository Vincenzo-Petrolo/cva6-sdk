# hostapd configuration for OpenWiFi AP mode on Theshire
# 5 GHz channel 36, OFDM-only rates, WPA2-PSK
#
# Known limitation: TX ACK timing issue prevents client association.
# Beacons are broadcast (AP visible to phones/laptops) but association
# fails. See docs/todo/todo_openwifi_tx_auth_failure.md.

interface=wlan0
driver=nl80211
country_code=CH
ssid=theshire
hw_mode=a
channel=36

# OFDM-only rates (no CCK/DSSS — OpenWiFi PHY is OFDM-only)
# Values are in units of 100 kbps
supported_rates=60 90 120 180 240 360 480 540
basic_rates=60 120 240

# 802.11n (HT) support
ieee80211n=1
# require_ht=1 would block non-HT clients — omitted to reduce barriers

# Open AP (no encryption) — simplifies testing during bring-up
#wpa=2
#wpa_passphrase=theshire-test
#wpa_key_mgmt=WPA-PSK
#rsn_pairwise=CCMP
