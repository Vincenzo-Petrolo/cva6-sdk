# udhcpd configuration for OpenWiFi AP mode on Theshire
# Assigns 192.168.44.10-50 to connected clients

start      192.168.44.10
end        192.168.44.50
interface  wlan0

# DNS points to the board — no DNS server runs, so DNS queries fail silently.
# Acceptable for a test tool; clients get IP but no name resolution.
opt dns    192.168.44.1
opt subnet 255.255.255.0
opt router 192.168.44.1

lease_file /var/lib/misc/udhcpd.leases
